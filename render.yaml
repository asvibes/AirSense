services:
  - type: web
    name: airsense
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 "app.main:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AIRSENSE_API_TOKEN
        sync: false
      - key: REQUIRE_API_TOKEN
        value: "true"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: AIRSENSE_DEVICE_KEY_PEPPER
        sync: false
      # Set after verifying the sender/domain and DNS authentication in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_DEFAULT_SENDER_NAME
        value: AirSense
      - key: PUBLIC_BASE_URL
        sync: false
      # Use the canonical HTTPS URL; invitation links use this value.
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
