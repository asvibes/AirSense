<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1980" viewBox="0 0 2500 1980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#176b87"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324d; }
      .title { font-size: 40px; font-weight: 700; }
      .sub { font-size: 20px; fill: #425b70; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #425b70; }
      .external { fill: #e8f4f8; stroke: #176b87; stroke-width: 3; }
      .process { fill: #e9f4ec; stroke: #398258; stroke-width: 3; }
      .store { fill: #fff3da; stroke: #ad7412; stroke-width: 3; }
      .flow { fill: none; stroke: #176b87; stroke-width: 3; marker-end: url(#arrow); }
      .label { font-size: 16px; font-weight: 600; fill: #164b61; }
    </style>
  </defs>
  <rect width="2050" height="1980" fill="#f8fafc"/>
  <text x="55" y="62" class="title">DFD Level 1 — AirSense process decomposition</text>
  <text x="55" y="100" class="sub">Processes and logical data stores reflect the local application; repeated E1/D2 symbols denote the same entity/store.</text>

  <rect x="50" y="330" width="350" height="210" rx="12" class="external"/>
  <text x="80" y="375" class="head">E1 User / owner</text>
  <text x="80" y="417" class="body">Credentials and CSRF</text>
  <text x="80" y="451" class="body">Home/configuration actions</text>
  <text x="80" y="485" class="body">Authorized session</text>

  <rect x="50" y="690" width="350" height="185" rx="12" class="external"/>
  <text x="80" y="735" class="head">E2 Sensor client</text>
  <text x="80" y="777" class="body">Device key + measurement</text>
  <text x="80" y="811" class="body">Timestamp and sensor identity</text>
  <text x="80" y="850" class="small">AirGradient input shape supported</text>

  <rect x="1800" y="100" width="650" height="130" rx="12" class="external"/>
  <text x="1830" y="145" class="head">E3 Email provider</text>
  <text x="1830" y="187" class="body">OTP / invitation delivery (optional)</text>

  <rect x="600" y="300" width="440" height="210" rx="16" class="process"/>
  <text x="635" y="345" class="head">1.0 Account &amp; access</text>
  <text x="635" y="387" class="body">Register, authenticate, manage sessions</text>
  <text x="635" y="421" class="body">Check home membership and role</text>
  <text x="635" y="465" class="small">Auth routes and session guards</text>

  <rect x="1200" y="300" width="440" height="210" rx="16" class="process"/>
  <text x="1235" y="345" class="head">2.0 Home configuration</text>
  <text x="1235" y="387" class="body">Homes, rooms, sensors, thresholds</text>
  <text x="1235" y="421" class="body">Owner/member actions</text>
  <text x="1235" y="465" class="small">Home-scoped authorization</text>

  <rect x="1800" y="300" width="650" height="210" rx="12" class="store"/>
  <text x="1830" y="345" class="head">D1 Account / configuration</text>
  <text x="1830" y="387" class="body">Users, homes, memberships, rooms</text>
  <text x="1830" y="421" class="body">Sensors, metrics, thresholds, challenges</text>
  <text x="1830" y="465" class="small">Active relational models</text>

  <rect x="600" y="660" width="440" height="220" rx="16" class="process"/>
  <text x="635" y="705" class="head">3.0 Ingest &amp; validate</text>
  <text x="635" y="747" class="body">Authenticate device; parse input</text>
  <text x="635" y="781" class="body">Validate value, unit, time and room</text>
  <text x="635" y="815" class="body">Preserve device/simulated/dataset source</text>
  <text x="635" y="854" class="small">Shared validator and ingestion path</text>

  <rect x="1200" y="660" width="440" height="220" rx="16" class="process"/>
  <text x="1235" y="705" class="head">4.0 Evaluate &amp; audit</text>
  <text x="1235" y="747" class="body">Apply thresholds and timing rules</text>
  <text x="1235" y="781" class="body">Manage alert state and deduplicate</text>
  <text x="1235" y="815" class="body">Record reading and audit event</text>
  <text x="1235" y="854" class="small">Application transaction</text>

  <rect x="1800" y="660" width="650" height="190" rx="12" class="store"/>
  <text x="1830" y="705" class="head">D2 Readings / alerts</text>
  <text x="1830" y="747" class="body">Measured values, provenance, alert state</text>
  <text x="1830" y="789" class="small">Default local persistence: SQLite</text>

  <rect x="1800" y="900" width="650" height="150" rx="12" class="store"/>
  <text x="1830" y="945" class="head">D3 Audit / rate-limit state</text>
  <text x="1830" y="987" class="body">Events and counters; no raw secrets</text>

  <rect x="50" y="1170" width="350" height="200" rx="12" class="external"/>
  <text x="80" y="1215" class="head">E1 User / owner</text>
  <text x="80" y="1257" class="body">Dashboard, history, analytics</text>
  <text x="80" y="1291" class="body">CSV/PDF and authorized photos</text>
  <text x="80" y="1330" class="small">Same entity as above</text>

  <rect x="600" y="1160" width="440" height="220" rx="16" class="process"/>
  <text x="635" y="1205" class="head">5.0 Query &amp; present</text>
  <text x="635" y="1247" class="body">Home-scoped dashboard and history</text>
  <text x="635" y="1281" class="body">Analytics, exports, authorized photos</text>
  <text x="635" y="1323" class="small">HTML pages and JSON APIs</text>

  <rect x="1800" y="1160" width="650" height="220" rx="12" class="store"/>
  <text x="1830" y="1205" class="head">D2 Readings / alerts</text>
  <text x="1830" y="1247" class="body">Same logical store as above</text>
  <text x="1830" y="1281" class="body">Authorized query input</text>
  <text x="1830" y="1323" class="small">Repeated symbol for readable flows</text>

  <rect x="600" y="1395" width="440" height="125" rx="12" class="external"/>
  <text x="635" y="1440" class="head">E4 Project operator</text>
  <text x="635" y="1482" class="body">Run training / review evaluation</text>

  <rect x="50" y="1550" width="350" height="190" rx="12" class="store"/>
  <text x="80" y="1595" class="head">D2 Readings / alerts</text>
  <text x="80" y="1637" class="body">Same logical store as above</text>
  <text x="80" y="1680" class="small">Forecast input series</text>

  <rect x="600" y="1550" width="440" height="190" rx="16" class="process"/>
  <text x="635" y="1595" class="head">6.0 Forecast evaluation</text>
  <text x="635" y="1637" class="body">Device/dataset series; no simulated rows</text>
  <text x="635" y="1671" class="body">Chronological evidence gate</text>
  <text x="635" y="1710" class="small">Forecast horizon up to 24 hours</text>

  <rect x="1800" y="1550" width="650" height="190" rx="12" class="store"/>
  <text x="1830" y="1595" class="head">D4 Local instance files</text>
  <text x="1830" y="1637" class="body">Forecast JSON and private photos</text>
  <text x="1830" y="1680" class="small">Configured filesystem; no Blob integration</text>

  <path d="M400 370 H600" class="flow"/>
  <text x="408" y="348" class="label">credentials / actions</text>
  <path d="M600 455 H400" class="flow"/>
  <text x="408" y="484" class="label">authorized response</text>
  <path d="M1040 370 H1200" class="flow"/>
  <text x="1048" y="348" class="label">authenticated request</text>
  <path d="M1640 400 H1800" class="flow"/>
  <text x="1648" y="378" class="label">configuration data</text>
  <path d="M820 300 V255 H2050 V230" class="flow"/>
  <text x="1190" y="245" class="label">OTP / invitation email request</text>
  <path d="M820 510 V550 H1770 V510" class="flow"/>
  <text x="1150" y="542" class="label">account and home configuration writes</text>

  <path d="M400 750 H600" class="flow"/>
  <text x="408" y="728" class="label">device key + payload</text>
  <path d="M1040 770 H1200" class="flow"/>
  <text x="1048" y="748" class="label">validated reading</text>
  <path d="M1640 745 H1800" class="flow"/>
  <text x="1648" y="723" class="label">reading / alert writes</text>
  <path d="M1640 830 H1740 V975 H1800" class="flow"/>
  <text x="1660" y="880" class="label">audit / rate state</text>

  <path d="M600 1225 H400" class="flow"/>
  <text x="408" y="1203" class="label">authorized response</text>
  <path d="M400 1315 H600" class="flow"/>
  <text x="408" y="1344" class="label">query / export request</text>
  <path d="M1800 1270 H1040" class="flow"/>
  <text x="1300" y="1247" class="label">authorized history reads</text>
  <path d="M400 1640 H600" class="flow"/>
  <text x="408" y="1618" class="label">chronological series</text>
  <path d="M1040 1645 H1800" class="flow"/>
  <text x="1320" y="1622" class="label">model JSON output</text>
  <path d="M1040 1320 H1090 V1480 H1770 V1600 H1800" class="flow"/>
  <text x="1330" y="1468" class="label">authorized photo files</text>
  <path d="M720 1520 V1550" class="flow"/>
  <path d="M900 1550 V1520" class="flow"/>

  <text x="50" y="1845" class="small">E = external entity; numbered rounded box = process; D = logical data store. Arrows are conceptual, not deployment network paths.</text>
  <text x="50" y="1885" class="small">Azure SQL, Blob Storage, and Power BI are not active application integrations in the inspected source snapshot.</text>
</svg>
