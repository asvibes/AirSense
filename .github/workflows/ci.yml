name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///instance/ci.sqlite3
      - run: python -m flask --app "app.main:create_app()" routes
        env:
          DATABASE_URL: sqlite:///instance/ci.sqlite3

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airsense
          POSTGRES_PASSWORD: airsense
          POSTGRES_DB: airsense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airsense -d airsense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://airsense:airsense@localhost:5432/airsense
      - run: python -m alembic downgrade 20261108_0007
        env:
          DATABASE_URL: postgresql+psycopg://airsense:airsense@localhost:5432/airsense
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://airsense:airsense@localhost:5432/airsense

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airsense_tests
          POSTGRES_PASSWORD: airsense_tests
          POSTGRES_DB: airsense_tests
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U airsense_tests -d airsense_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://airsense_tests:airsense_tests@localhost:5433/airsense_tests
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://airsense_tests:airsense_tests@localhost:5433/airsense_tests