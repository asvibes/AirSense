<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset verification | AirSense</title><link rel="stylesheet" href="{{ url_for('static', filename='css/airsense-theme.css') }}"><style>body{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(100%,440px);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.field{display:grid;gap:8px;margin:18px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}.button{padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--bg);font-weight:700}</style></head>
<body><main class="card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Enter your reset code</h1><p>{{ message }}</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form id="reset-verify-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field">Email<input name="email" type="email" value="{{ email or '' }}" autocomplete="email" required></label><label class="field">Reset code<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="button" type="submit">Verify code</button><button class="button" id="resend-code" type="button">Resend code</button><p id="status" role="status"></p></form><script>const form=document.getElementById("reset-verify-form"),status=document.getElementById("status"),resend=document.getElementById("resend-code"),csrf=form.elements.csrf_token.value;form.addEventListener("submit",async event=>{event.preventDefault();const payload=Object.fromEntries(new FormData(form));const response=await fetch("{{ url_for('auth.verify_reset') }}",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":payload.csrf_token},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){status.textContent=result.error||"Unable to verify code.";return}window.location.assign("{{ url_for('auth.reset_password_page') }}?token="+encodeURIComponent(result.reset_token));});resend.addEventListener("click",async()=>{const email=form.elements.email.value;resend.disabled=true;resend.textContent="Sending...";status.textContent="";try{const response=await fetch("{{ url_for('auth.resend_password_reset') }}",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({email,csrf_token:csrf})});const result=await response.json();status.textContent=response.ok?(result.message||"If an account matches that email, a reset code has been sent."):(result.error||"Unable to send the reset email. Please try again later.");if(response.ok){let remaining=60;const timer=setInterval(()=>{remaining-=1;if(remaining<=0){clearInterval(timer);resend.disabled=false;resend.textContent="Resend code";}else{resend.textContent="Resend code ("+remaining+"s)";}},1000);}}catch(error){status.textContent="Unable to send the reset email. Please try again later.";resend.disabled=false;resend.textContent="Resend code";}});</script></main></body>
</html>
