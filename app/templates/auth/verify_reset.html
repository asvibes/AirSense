<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset verification | AirSense</title><link rel="stylesheet" href="{{ url_for('static', filename='css/airsense-theme.css') }}"><style>body{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(100%,440px);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.field{display:grid;gap:8px;margin:18px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}.button{padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--bg);font-weight:700}</style></head>
<body><main class="card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Enter your reset code</h1><p>{{ message }}</p><form id="reset-verify-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field">Email<input name="email" type="email" required></label><label class="field">Reset code<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="button" type="submit">Verify code</button><p id="status" role="status"></p></form><script>document.getElementById("reset-verify-form").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;const payload=Object.fromEntries(new FormData(form));const response=await fetch("{{ url_for('auth.verify_reset') }}",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":payload.csrf_token},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){document.getElementById("status").textContent=result.error||"Unable to verify code.";return}window.location.assign("{{ url_for('auth.reset_password_page') }}?token="+encodeURIComponent(result.reset_token));});</script></main></body>
</html>
