<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email | AirSense</title><link rel="stylesheet" href="{{ url_for('static', filename='css/airsense-theme.css') }}"><style>body{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(100%,440px);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.field{display:grid;gap:8px;margin:18px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}.button{padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--bg);font-weight:700}.notice{padding:12px;border-radius:8px;background:var(--surface2);color:var(--text)}.error{color:var(--bad)}</style></head>
<body><main class="card"><p class="eyebrow">ACCOUNT VERIFICATION</p><h1>Verify your email</h1><p>Enter the 6-digit code sent to your email. It expires in 10 minutes.</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('auth.verify_email') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url }}"><label class="field">Email<input id="verification-email" name="email" type="email" value="{{ email }}" required></label><label class="field">Verification code<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="button" type="submit">Verify email</button></form><button class="button" id="resend-code" type="button" style="margin-top:12px">Resend code</button><p id="resend-status" role="status"></p><p><a href="{{ url_for('auth.login_page') }}">Back to sign in</a></p><script>document.getElementById("resend-code").addEventListener("click",async()=>{const button=document.getElementById("resend-code");const status=document.getElementById("resend-status");button.disabled=true;const response=await fetch("{{ url_for('auth.resend_verification') }}",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":"{{ csrf_token }}"},body:JSON.stringify({email:document.getElementById("verification-email").value})});const result=await response.json();status.textContent=result.message||result.error||"Unable to resend the code.";window.setTimeout(()=>{button.disabled=false},60000)});</script></main></body>
</html>
