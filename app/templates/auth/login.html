<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AirSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="{{ url_for('auth.login_page') }}"><span class="brand-mark">A</span><span>airsense</span></a>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Sign in</h1>
    <p class="page-subtitle">Access your AirSense home dashboard.</p>
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <button class="button button-dark" type="submit">Sign in</button>
    </form>
    <p class="auth-switch">New to AirSense? <a href="{{ url_for('auth.register_page') }}">Create an account</a></p>
    <p class="disclaimer">AirSense supports ventilation decisions; it is not a medical or safety device and does not replace a certified carbon monoxide alarm.</p>
  </main>
</body>
</html>
