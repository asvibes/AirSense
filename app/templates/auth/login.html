<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Sign in | AirSense</title>
  <style>
    :root {
      color-scheme: dark;
      background: #120f17;
      --air-white: #f7f9fa;
      --air-muted: rgba(247, 249, 250, .72);
      --air-lilac: #c8abff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { color-scheme: dark; background: #120f17; scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body.auth-page {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      background: #120f17 !important;
      color: var(--air-white);
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body.auth-page a { color: inherit; text-decoration: none; }
    .auth-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 0;
      gap: 0;
      overflow: hidden;
      background: #120f17;
    }
    .auth-aside {
      position: relative;
      isolation: isolate;
      min-width: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #120f17;
    }
    .shape-waves-layer {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
      background: #120f17;
    }
    .shape-waves-layer canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 600ms cubic-bezier(.22, 1, .36, 1);
    }
    .shape-waves-layer[data-ready="true"] canvas { opacity: 1; }
    .auth-right {
      display: grid;
      min-width: 0;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: clamp(28px, 5vw, 72px);
      background: #120f17;
    }
    .auth-card {
      align-self: center;
      justify-self: center;
      width: min(100%, 384px);
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--air-white);
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .gradient-text {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      max-width: 100%;
      isolation: isolate;
    }
    .gradient-text__content {
      display: inline-block;
      background-image: linear-gradient(90deg, #77757d 0%, #aaa8b0 40%, #ffffff 75%, #77757d 110%);
      background-size: 300% 100%;
      background-position: 0% 50%;
      animation: gradient-text-flow 8s ease-in-out infinite alternate;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: .35px rgba(255, 255, 255, .2);
    }
    @keyframes gradient-text-flow {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }
    .auth-card h1 {
      margin: 0;
      font-size: clamp(36px, 4.3vw, 48px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.04;
    }
    .page-subtitle {
      margin: 16px 0 30px;
      color: var(--air-muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .notice {
      margin: 0 0 20px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 125, 125, .34);
      border-radius: 9px;
      background: rgba(128, 37, 48, .42);
      color: #ffd7d7;
      font-size: 14px;
      line-height: 1.5;
    }
    .auth-card form { display: grid; gap: 18px; }
    .field {
      display: grid;
      gap: 8px;
      color: rgba(247, 249, 250, .9);
      font-size: 13px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid rgba(247, 249, 250, .24);
      border-radius: 8px;
      outline: none;
      background: rgba(18, 15, 23, .58);
      color: var(--air-white);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.4;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .field input::placeholder { color: rgba(247, 249, 250, .48); }
    .password-control { position: relative; display: block; width: 100%; }
    .password-control input { padding-right: 68px; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 6px 2px;
      border: 0;
      background: transparent;
      color: rgba(247, 249, 250, .72);
      font: 500 12px/1 "Geist", ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .password-toggle:hover { color: #fff; }
    .password-toggle:focus-visible { outline: 2px solid var(--air-lilac); outline-offset: 2px; border-radius: 3px; }
    .field input:focus {
      border-color: var(--air-lilac);
      background: rgba(18, 15, 23, .82);
      box-shadow: 0 0 0 3px rgba(200, 171, 255, .16);
    }
    .button.button-dark {
      min-height: 50px;
      margin-top: 4px;
      padding: 13px 18px;
      border: 1px solid rgba(247, 249, 250, .9);
      border-radius: 8px;
      background: var(--air-white);
      color: #101014;
      font: 600 14px/1.2 "Geist", ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .button.button-dark:hover { transform: translateY(-1px); background: #fff; box-shadow: 0 8px 28px rgba(200, 171, 255, .18); }
    .button.button-dark:active { transform: translateY(0); }
    .auth-switch { margin: 24px 0 0; color: var(--air-muted); font-size: 13px; }
    .auth-switch a { color: var(--air-lilac) !important; text-decoration: underline !important; text-underline-offset: 3px; }
    .disclaimer {
      margin: 32px 0 0;
      padding-top: 16px;
      border-top: 1px solid rgba(247, 249, 250, .16);
      color: rgba(247, 249, 250, .58);
      font-size: 11px;
      line-height: 1.6;
    }
    :focus-visible { outline: 2px solid var(--air-lilac); outline-offset: 3px; }
    @media (max-width: 760px) {
      .auth-layout {
        width: 100%;
        min-height: 100svh;
        margin: 0;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(220px, 32svh) minmax(68svh, auto);
        border: 0;
        border-radius: 0;
      }
      .auth-aside { min-height: 0; }
      .auth-right { min-height: 0; padding: 38px clamp(24px, 8vw, 56px) 48px; }
      .auth-card { width: 100%; max-width: 384px; min-height: 0; padding: 0; }
      .auth-card h1 { font-size: clamp(34px, 8vw, 42px); }
    }
    @media (max-height: 700px) and (min-width: 761px) {
      .auth-layout { min-height: 100svh; margin-block: 0; }
      .auth-right { min-height: 100svh; }
      .auth-card { padding-block: 0; }
      .page-subtitle { margin-block: 12px 20px; }
      .disclaimer { margin-top: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .shape-waves-layer canvas { transition: none; }
      .gradient-text__content { animation: none; background-position: 50% 50%; }
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <aside class="auth-aside" aria-label="Animated ShapeWaves background">
      <div class="shape-waves-layer" aria-hidden="true" data-ready="false"><canvas></canvas></div>
    </aside>
    <div class="auth-right">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title"><span class="gradient-text"><span class="gradient-text__content">Hey, good to see you again.</span></span></h1>
      <p class="page-subtitle">Your home has updates. Your rooms have readings. Curious? Let's get you in.</p>
      <p class="auth-switch"><a href="{{ url_for('landing') }}">Back to AirSense home</a></p>
      {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('auth.login', next=next_url) if next_url else url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label class="field">Password<span class="password-control"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button></span></label>
        <button class="button button-dark" type="submit">Let's get inside</button>
      </form>
      <p class="auth-switch">New to AirSense? <a href="{{ url_for('auth.register_page') }}">Join the family</a></p>
      <p class="disclaimer">Readings depend on configured sensors or simulator data. AirSense doesn't measure air itself.</p>
    </section>
    </div>
  </main>

  <script>
    (() => {
      const password = document.getElementById('password');
      const passwordToggle = document.querySelector('.password-toggle');
      passwordToggle?.addEventListener('click', () => {
        const isVisible = password.type === 'text';
        password.type = isVisible ? 'password' : 'text';
        passwordToggle.textContent = isVisible ? 'Show' : 'Hide';
        passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      });

      const root = document.querySelector('.shape-waves-layer');
      const canvas = root?.querySelector('canvas');
      const ctx = canvas?.getContext('2d', { alpha: false });
      const panel = root?.parentElement;
      if (!root || !canvas || !ctx || !panel) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const base = [146, 146, 146];
      const hot = [255, 255, 255];
      const bg = [18, 15, 23];
      const cell = 10;
      const state = { width: 0, height: 0, dpr: 1, cols: 0, rows: 0, start: performance.now(), raf: 0, pointer: null, splashes: [] };
      let visible = true;

      const hash = (x, y) => {
        const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return v - Math.floor(v);
      };
      const smooth = (a, b, x) => {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };
      const resize = () => {
        const rect = root.getBoundingClientRect();
        state.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        state.width = Math.max(1, rect.width);
        state.height = Math.max(1, rect.height);
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        state.cols = Math.ceil(state.width / cell);
        state.rows = Math.ceil(state.height / cell);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        requestDraw();
      };
      const drawShape = (x, y, size, type) => {
        ctx.beginPath();
        if (type === 0) ctx.rect(x - size, y - size, size * 2, size * 2);
        else if (type === 1) ctx.arc(x, y, size, 0, Math.PI * 2);
        else {
          ctx.moveTo(x, y - size * 1.2);
          ctx.lineTo(x + size * 1.05, y + size * .8);
          ctx.lineTo(x - size * 1.05, y + size * .8);
          ctx.closePath();
        }
        ctx.fill();
      };
      let lastDraw = 0;
      const render = now => {
        state.raf = 0;
        if (!visible || !state.width || !state.height) return;
        if (!reduceMotion.matches && now - lastDraw < 32) { requestDraw(); return; }
        lastDraw = now;
        const time = reduceMotion.matches ? 0 : (now - state.start) / 1000;
        ctx.fillStyle = `rgb(${bg.join(',')})`;
        ctx.fillRect(0, 0, state.width, state.height);
        const intro = reduceMotion.matches ? 1 : smooth(0, 1.6, time);
        const introEnd = 2.8;
        const pointer = state.pointer;
        state.splashes = state.splashes.filter(s => time - s.time < 1.5);

        for (let row = 0; row < state.rows; row++) {
          for (let col = 0; col < state.cols; col++) {
            const x = (col + .5) * cell;
            const y = (row + .5) * cell;
            const nx = x / state.width;
            const ny = y / state.height;
            const n = hash(col, row);
            const field = .5 + .22 * Math.sin(nx * 9.2 + time * .55) + .18 * Math.cos(ny * 7.4 - time * .42) + .1 * Math.sin((nx + ny) * 12 + time * .28) + (n - .5) * .18;
            let level = .22 + .78 * smooth(.12, .88, field);
            const edge = Math.max(Math.abs(nx * 2 - 1), Math.abs(ny * 2 - 1));
            level *= 1 - .25 * smooth(.68, 1, edge);
            const radial = Math.hypot(nx - .5, ny - .5) * 1.15;
            const startAt = radial + n * .16;
            const reveal = reduceMotion.matches ? 1 : smooth(startAt, startAt + .2, (time / 1.6) * 1.6);
            if (!reduceMotion.matches && time < introEnd && time / 1.6 < startAt) continue;
            level *= intro;

            let energy = 0;
            if (pointer) {
              const d = Math.hypot(x - pointer.x, y - pointer.y);
              energy = Math.max(energy, .68 * (1 - smooth(0, 54, d)));
            }
            for (const splash of state.splashes) {
              const age = time - splash.time;
              const distance = Math.hypot(x - splash.x, y - splash.y);
              const ring = Math.abs(distance - age * 190);
              energy = Math.max(energy, .98 * (1 - smooth(0, 30 + age * 20, ring)) * (1 - age / 1.5));
            }
            const brightness = Math.max(0, Math.min(1, level * (.55 + reveal * .45)));
            const mix = Math.max(0, Math.min(.92, energy));
            const r = Math.round(base[0] + (hot[0] - base[0]) * mix);
            const g = Math.round(base[1] + (hot[1] - base[1]) * mix);
            const b = Math.round(base[2] + (hot[2] - base[2]) * mix);
            ctx.globalAlpha = brightness * 0.44;
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            const shape = (col * 13 + row * 7 + Math.floor(field * 3)) % 3;
            const size = Math.max(.45, .75 * (cell / 2) * (.72 + .28 * smooth(.2, .9, field)));
            drawShape(x, y, size, shape);
          }
        }
        ctx.globalAlpha = 1;
        root.dataset.ready = 'true';
        if (!reduceMotion.matches || state.splashes.length) requestDraw();
      };
      const requestDraw = () => {
        if (!state.raf && visible) state.raf = requestAnimationFrame(render);
      };
      const locatePointer = event => {
        const rect = panel.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        state.pointer = x >= 0 && y >= 0 && x <= rect.width && y <= rect.height ? { x, y } : null;
        requestDraw();
      };
      const splash = event => {
        const rect = panel.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
        state.splashes.push({ x, y, time: (performance.now() - state.start) / 1000 });
        requestDraw();
      };
      const observer = new IntersectionObserver(entries => {
        visible = entries.some(entry => entry.isIntersecting);
        if (visible) requestDraw();
        else if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; }
      });
      observer.observe(panel);
      new ResizeObserver(resize).observe(root);
      window.addEventListener('pointermove', locatePointer, { passive: true });
      panel.addEventListener('pointerdown', splash, { passive: true });
      window.addEventListener('blur', () => { state.pointer = null; });
      reduceMotion.addEventListener?.('change', requestDraw);
      resize();
    })();
  </script>

</body>
</html>
