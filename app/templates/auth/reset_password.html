<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | AirSense</title><link rel="stylesheet" href="{{ url_for('static', filename='css/airsense-theme.css') }}"><style>body{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(100%,440px);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.field{display:grid;gap:8px;margin:18px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}.button{padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--bg);font-weight:700}</style></head>
<body><main class="card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Create a new password</h1><form method="post" action="{{ url_for('auth.reset_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="reset_token" value="{{ token }}"><label class="field">New password<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button class="button" type="submit">Save new password</button></form></main></body>
</html>
